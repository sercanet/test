<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Multiplayer Oyun</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h2 { margin-bottom: 10px; }
        canvas {
            background-color: #2b2b2b;
            border: 3px solid #48bb78;
            box-shadow: 0 0 20px rgba(72, 187, 120, 0.3);
        }
    </style>
</head>
<body>
    <h2>Online Multiplayer Arena</h2>
    <p>Karakterini <b>W, A, S, D</b> veya <b>Yön Tuşları</b> ile hareket ettir!</p>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let players = {};

        // Klavye Tuş Durumları
        const keys = {
            up: false,
            down: false,
            left: false,
            right: false
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.up = true;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.down = true;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
            socket.emit('move', keys);
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.up = false;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.down = false;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
            socket.emit('move', keys);
        });

        // Sunucudan tüm oyuncuların konumunu al
        socket.on('state', (serverPlayers) => {
            players = serverPlayers;
            draw();
        });

        // Ekranı Çizme Fonksiyonu
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Tüm oyuncuları çiz
            for (let id in players) {
                const player = players[id];
                ctx.fillStyle = player.color;
                ctx.fillRect(player.x, player.y, 30, 30);

                // Oyuncu ID'sini üstüne yaz
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px Arial';
                ctx.fillText(id.substring(0, 5), player.x, player.y - 5);
            }
        }
    </script>
</body>
</html>
